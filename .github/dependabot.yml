# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:

  # NuGet packages — Central Package Management means Directory.Packages.props at
  # the repo root is the single source of truth. Group all updates into one PR.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      all-nuget-updates:
        patterns: ["*"]
        update-types: [major, minor, patch]
    commit-message:
      prefix: deps
    labels: [dependencies, nuget]

  # GitHub Actions used in workflows. Keeps action SHAs/versions current —
  # matters for supply-chain hygiene and deprecation warnings.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      all-github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
